<body>

  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a class="nav-logo" href="index.html"><img src="assets/logo.png" alt="Trend Corner — home" width="64" height="64"></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">MENU</button>
      <div class="nav-menu" id="nav-menu">
        <ul class="nav-list nav-list--left">
        <li><a href="index.html">Home</a></li>

        <ul class="nav-list nav-list--right">

        <span class="nav-cart">Cart (<span data-cart-count>0</span>)</span>

        <button type="button" class="btn btn-sm" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="btn btn-sm" data-filter="tee" aria-pressed="false">Tees</button>
        <button type="button" class="btn btn-sm" data-filter="pants" aria-pressed="false">Pants</button>
      </div>
      <div class="grid reveal" data-grid="products" data-filter-grid></div>
    </section>
